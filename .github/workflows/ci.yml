name: Flutter CI / Pruebas Automaticas

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  static_analysis_and_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Ejecutar análisis estático
        run: flutter analyze

      - name: Ejecutar pruebas unitarias y de widget
        run: flutter test --exclude-tags golden --exclude-tags integration

  golden_tests:
    runs-on: ubuntu-latest
    needs: static_analysis_and_unit_tests
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Ejecutar Golden Tests
        run: xvfb-run -a flutter test --tags golden

  integration_tests:
    runs-on: macos-latest
    needs: static_analysis_and_unit_tests
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Ejecutar pruebas de integración
        run: flutter test integration_test/
