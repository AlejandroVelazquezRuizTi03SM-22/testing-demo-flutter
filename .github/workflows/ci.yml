name: Flutter CI / Pruebas Automaticas

# Define cuándo se ejecutará este flujo de trabajo
on:
  push:
    branches:
      - main
      - feature/** # Cubre tu rama 'feature/testing-setup'
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Análisis Estático y Pruebas Ligeras
  static_analysis_and_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          
      - name: Instalar Dependencias
        run: flutter pub get

      # LÍNEA CORREGIDA: No hay línea en blanco ni indentación incorrecta aquí.
      - name: 1. Ejecutar Análisis Estático (Criterio: 15% - Lint en verde)
        # Este paso fallará si hay violaciones en analysis_options.yaml
        run: flutter analyze

      - name: 2. Ejecutar Pruebas Unitarias y Widget (Criterio: 20% - Pasan)
        # Excluye golden e integración para correr solo pruebas rápidas
        run: flutter test --exclude-feature-regex 'golden|integration'

  # Job 2: Pruebas Golden de Regresión Visual
  golden_tests:
    runs-on: ubuntu-latest
    needs: [static_analysis_and_unit_tests] 
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          
      - name: Instalar Dependencias
        run: flutter pub get

      - name: 3. Ejecutar Golden Tests (Criterio: 15% - Funcional)
        # Se requiere un runner que soporte la renderización headless
        run: flutter test --tags golden
        
  # Job 3: Pruebas de Integración (E2E)
  integration_tests:
    runs-on: macos-latest # Usar macOS para un entorno con emulador más fiable
    needs: [static_analysis_and_unit_tests]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Instalar Dependencias
        run: flutter pub get

      - name: 4. Ejecutar Pruebas de Integración (Criterio: 20% - Flujo básico)
        # El runner de macos ya tiene los SDK necesarios para emulación
        run: |
          # El comando 'flutter test integration_test/' se ejecuta solo si hay un emulador
          flutter test integration_test/