name: Flutter CI / Pruebas Automaticas

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.35.7'

jobs:
  static_analysis_and_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Preparar CLI
        run: |
          flutter --version
          flutter config --no-analytics --no-cli-animations

      - name: Instalar dependencias
        run: flutter pub get

      - name: Ejecutar análisis estático
        run: flutter analyze

      - name: Ejecutar pruebas unitarias y de widget (no golden)
        run: |
          flutter test test/widget_test.dart
          flutter test test/calc_test.dart

  golden_tests:
    runs-on: ubuntu-latest
    needs: static_analysis_and_unit_tests
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Preparar CLI
        run: |
          flutter --version
          flutter config --no-analytics --no-cli-animations

      - name: Instalar dependencias
        run: flutter pub get

      - name: Ejecutar Golden Tests (actualiza baselines)
        run: xvfb-run -a flutter test test/golden_test.dart --tags golden --update-goldens

      - name: Subir goldens como artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-images
          path: |
            **/goldens/**
            **/golden/**
            **/failures/**
          if-no-files-found: warn

  integration_tests:
    runs-on: macos-latest
    needs: static_analysis_and_unit_tests
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Preparar CLI (iOS)
        run: |
          flutter --version
          flutter config --no-analytics --no-cli-animations
          flutter doctor -v
          xcodebuild -version
          xcrun simctl list

      - name: Bootear simulador iOS (iPhone 15)
        env:
          IOS_DEVICE: "iPhone 15"
        run: |
          UDID=$(xcrun simctl list devices | awk -F '[()]' '/iPhone 15 \(.*Shutdown\)/{print $2; exit}')
          if [ -z "$UDID" ]; then
            echo "No se encontró un iPhone 15 apagado; buscando cualquiera disponible…"
            UDID=$(xcrun simctl list devices | awk -F '[()]' '/iPhone .* \(.*Shutdown\)/{print $2; exit}')
          fi
          if [ -z "$UDID" ]; then
            echo "No hay simuladores disponibles. Fallando."
            exit 1
          fi
          echo "Usando UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          open -a Simulator || true
          xcrun simctl list | sed -n "/$UDID/,\$p" | head -n 20

      - name: Instalar dependencias
        run: flutter pub get

      - name: Build iOS para simulador
        run: |
          # Asegura que exista carpeta ios y CocoaPods resuelto
          if [ -d "ios" ]; then
            cd ios
            pod install --repo-update
            cd ..
          fi
          flutter build ios --simulator --no-codesign

      - name: Ejecutar pruebas de integración en iOS Simulator
        run: |
          # Seleccionar el primer simulador booted
          DEVICE_ID=$(xcrun simctl list devices | awk -F '[()]' '/Booted/{print $2; exit}')
          if [ -z "$DEVICE_ID" ]; then
            echo "No hay simulador booted."
            exit 1
          fi
          flutter devices
          echo "Usando simulador: $DEVICE_ID"
          flutter test -d "$DEVICE_ID" integration_test/
